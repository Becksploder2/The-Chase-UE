name: Build The Chase Godot Desktop

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  export:
    strategy:
      matrix:
        include:
          - os: windows-latest
            preset: Windows Desktop
            artifact: Chase-Godot-Windows
            output: build/windows/TheChase.exe
          - os: macos-latest
            preset: macOS
            artifact: Chase-Godot-macOS
            output: build/macos/TheChase.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Validate native project
        run: godot --headless --path . --editor --quit --verbose
      - name: Prepare export directory
        shell: bash
        run: mkdir -p "$(dirname "${{ matrix.output }}")"
      - name: Export desktop game
        run: godot --headless --path . --export-release "${{ matrix.preset }}" "${{ matrix.output }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error
